<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Project — Alfaro Vardana Putra</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF7; --ink:#1D231F; --accent:#4285F4; --accent-dark:#2f5fc4;
    --accent-soft:#E8F0FE; --line:#E1DDD3; --muted:#6E695C; --nav-h:76px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em;}
  a{color:inherit; text-decoration:none;}

  .topbar{
    position:fixed; top:0; left:0; right:0; height:var(--nav-h);
    background:var(--accent); border-bottom:1px solid var(--accent-dark); z-index:200;
    display:flex; align-items:center; justify-content:space-between; padding:0 48px;
  }
  .brand{display:flex; flex-direction:column; line-height:1.2;}
  .brand .name{font-weight:600; font-size:1rem; color:#fff;}
  .brand .role{font-size:0.72rem; color:rgba(255,255,255,0.78); font-family:'JetBrains Mono', monospace;}
  .back-link{
    display:inline-flex; align-items:center; gap:8px; font-size:0.85rem; color:#fff;
    border:1px solid rgba(255,255,255,0.5); padding:9px 18px; border-radius:2px; transition:all .25s ease;
  }
  .back-link:hover{background:#fff; color:var(--accent); border-color:#fff;}

  .content{max-width:820px; margin:0 auto; padding:calc(var(--nav-h) + 60px) 40px 100px;}

  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:0.75rem; color:var(--accent);
    text-transform:uppercase; letter-spacing:0.12em; margin-bottom:18px; display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{content:''; width:24px; height:1px; background:var(--accent);}

  h1.detail-title{font-size:clamp(1.9rem, 4vw, 2.6rem); margin-bottom:28px;}

  .detail-image{
    width:100%; border-radius:8px; overflow:hidden; border:1px solid var(--line);
    background:var(--accent-soft); margin-bottom:36px;
  }
  .detail-image img{width:100%; height:auto; display:block;}

  .detail-desc{font-size:1rem; color:var(--ink); max-width:70ch;}
  .detail-desc p{margin-bottom:18px; color:var(--muted); font-size:0.96rem; line-height:1.8;}

  .detail-actions{margin-top:40px; display:flex; gap:16px; flex-wrap:wrap;}
  .btn{padding:14px 26px; border-radius:2px; font-size:0.88rem; font-weight:500; display:inline-flex; align-items:center; gap:8px; transition:all .25s ease;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent);}

  .not-found{text-align:center; padding:60px 0;}
  .not-found h2{margin-bottom:14px;}
  .not-found p{color:var(--muted); margin-bottom:28px;}

  @media (max-width:700px){
    .topbar{padding:0 20px;}
    .content{padding:calc(var(--nav-h) + 40px) 20px 70px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="name">Alfaro Vardana Putra</span>
    <span class="role">Siswa SMK Budi Mulia · Jaringan &amp; Komputer</span>
  </div>
  <a href="index.html" class="back-link">← Kembali ke Portfolio</a>
</header>

<main class="content" id="detailContent">
  <!-- Konten diisi otomatis oleh JavaScript berdasarkan ?id= di URL -->
</main>

<script>
  // Data semua project. Tambahkan objek baru di sini kalau mau menambah project.
  const PROJECTS = {
    1: {
      tag: "Web Development",
      title: "Website Portfolio",
      image: "Screenshot 2026-07-29 133200.png",
      description: [
        "Website portfolio pribadi yang dibuat menggunakan HTML, CSS, dan JavaScript untuk menampilkan profil, skills, dan project secara ringkas dan profesional.",
        "Fokus pengembangan ada pada struktur yang rapi, navigasi yang jelas, serta tampilan responsif sehingga tetap nyaman diakses baik dari desktop maupun perangkat mobile."
      ]
    },
    2: {
      tag: "Design",
      title: "Pembuatan Logo dan Branding",
      image: "Logo Alfaro Lancdscape.png",
      description: [
        "Desain logo dan identitas visual untuk sebuah brand, disusun menggunakan tools desain profesional dengan pendekatan minimalis dan mudah dikenali.",
        "Proses meliputi eksplorasi konsep, pemilihan palet warna, tipografi, hingga penerapan logo ke berbagai media agar identitas brand konsisten di semua platform."
      ]
    },
    3: {
      tag: "Design",
      title: "Hosting Acara Kebersamaan",
      image: "INSPIRING TIME.png",
      description: [
        "Organisasi dan penyelenggaraan acara kebersamaan dengan konsep desain visual yang menarik, mulai dari perencanaan hingga eksekusi di lapangan.",
        "Melibatkan koordinasi tim, penyusunan materi visual pendukung acara, serta memastikan seluruh rangkaian kegiatan berjalan lancar sesuai konsep yang direncanakan."
      ]
    },
    4: {
      tag: "Design",
      title: "Project Donasi Darah",
      image: "donor darah varo .png",
      description: [
        "Desain dan pelaksanaan kampanye donasi darah dengan konsep visual yang menarik untuk mengajak lebih banyak partisipan.",
        "Meliputi pembuatan materi promosi, poster, dan dokumentasi kegiatan sebagai bagian dari kampanye sosial yang bertujuan meningkatkan kesadaran pentingnya donor darah."
      ]
    }
  };

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const project = PROJECTS[id];
  const container = document.getElementById('detailContent');

  if (project) {
    document.title = project.title + " — Alfaro Vardana Putra";
    container.innerHTML = `
      <div class="eyebrow">${project.tag}</div>
      <h1 class="detail-title">${project.title}</h1>
      <div class="detail-image">
        <img src="${project.image}" alt="${project.title}">
      </div>
      <div class="detail-desc">
        ${project.description.map(p => `<p>${p}</p>`).join('')}
      </div>
      <div class="detail-actions">
        <a href="index.html#portfolio" class="btn btn-ghost">← Kembali ke Portfolio</a>
      </div>
    `;
  } else {
    container.innerHTML = `
      <div class="not-found">
        <h2>Project tidak ditemukan</h2>
        <p>Project yang kamu cari tidak tersedia atau link-nya salah.</p>
        <a href="index.html#portfolio" class="btn btn-primary">Kembali ke Portfolio</a>
      </div>
    `;
  }
</script>

</body>
</html>
